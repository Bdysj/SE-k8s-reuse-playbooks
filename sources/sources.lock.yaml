baseline_overrides:
  storage_class:
    setting: redis.storageClassName = local-path
    chart_default: standard
    reason: 'k3s provides the local-path storage class. With the chart default the redis PersistentVolumeClaim stays
      Pending and the StatefulSet never starts.

      '
  memory_profile:
    rule: 'For any container whose observed steady-state working set exceeds 60 per cent of the chart memory limit,
      set limit to 256Mi and request to 128Mi. Applied uniformly to the affected services rather than tuned per
      service.

      '
    reason: 'Robot Shop images are linux/amd64 and run under emulation on Apple silicon, which raises the resident
      set. At the chart limit of 100Mi the ratings container was OOMKilled with exit code 137 while its own health
      check and API were returning 200, so the fault was environmental rather than application behaviour. An unstable
      baseline would invalidate the healthy-state checks that Section 3.5.3 requires before fault injection.

      '
    observed_working_set_at_chart_limit_100Mi:
      ratings: '>100Mi (OOMKilled)'
      user: 80Mi
      cart: 78Mi
      payment: 65Mi
      catalogue: 51Mi
      web: 42Mi
    applied_to:
    - cart
    - catalogue
    - dispatch
    - payment
    - ratings
    - user
    - web
    - redis
    new_values:
      requests_memory: 128Mi
      limits_memory: 256Mi
    unchanged:
    - mysql
    - mongodb
    - rabbitmq
    - load
    additional:
      shipping:
        requests_memory: 640Mi
        limits_memory: 2048Mi
        limits_cpu: 2000m
        chart_values:
          requests: 500Mi
          limits: 1000Mi
          limits_cpu: 500m
        cpu_reason: 'Spring Boot startup is CPU bound and emulation multiplies that cost. At the chart CPU limit
          of 500m the container was throttled and did not reach a ready state within the readiness budget of the
          probe (initialDelay 5s, period 5s, failureThreshold 30, so 155s). The limit is raised only to absorb emulation
          overhead; steady-state use is near 200m.

          '
        reason: 'The shipping container was also OOMKilled with exit code 137 at the chart limit of 1000Mi. It is
          a Spring Boot service whose JVM heap grows during Hibernate initialisation, and emulation lengthens that
          phase. Observed working set reached 626Mi before the kill.

          '
    verified_after_override:
      ratings_working_set: 159Mi
    note: 'CPU values are unchanged. P3 resource-adjustment scenarios are defined against this baseline, so the
      injected misconfiguration remains a reduction relative to it.

      '
  workload:
    setting: load generator NUM_CLIENTS = 5
    manifest_default: 15
    reason: 'Table 1.2 holds workload demand fixed, so the level must be declared. At the manifest default of 15
      concurrent clients the load container was OOMKilled at its 200Mi limit, and the resulting request rate drove
      Apache prefork in the ratings container past 256Mi so that it was also OOMKilled. Both effects are workload-driven
      rather than injected faults, and an unstable baseline would invalidate the healthy-state checks of Section
      3.5.3.

      '
    also_applied:
      load:
        requests_memory: 384Mi
        limits_memory: 1024Mi
      ratings:
        requests_memory: 192Mi
        limits_memory: 512Mi
    note: 'The level will be confirmed by a stability window with zero restarts before any registration qualification
      trial.

      '
    native_resource_reason: NUM_CLIENTS remains 5, all upstream transactions/waits unchanged. Prior native generator
      was OOMKilled at 512Mi. Grouped statistics remained at 16 route entries but observed RSS still reached 364Mi,
      so grouping alone is not accepted as a complete memory fix; 1Gi is the declared pilot envelope and must pass
      the stability window.
    native_stability_acceptance: Two five-user generators, 30-minute requested window, zero Pod replacements/restarts
      and zero failures outside the designated upstream error task. Exact raw counts in results/dual-cluster/post-cleanup-stability/summary.json.
  host_capacity_BLOCKER:
    status: 'Native hybrid pilot accepted: three data-reset cycles, actual independent replica repair/isolation
      and strict sustained dual-cluster window passed under dedicated Mac operation. No formal main/RQ3b trials.'
    measurements:
      docker_vm: 8 CPU, 7.75 GiB
      k3d_cpu_with_load_generator: '>811% of 800% available (saturated)'
      k3d_cpu_with_load_generator_stopped: 725% of 800%
      k3d_cpu_after_restart_app_degraded: 601% of 800%
      host_load_average: 69 to 142
      consequences:
      - kube-apiserver returned 'TLS handshake timeout'
      - metrics-server became unavailable, so kubectl top stopped working
      - ratings was OOMKilled repeatedly even at a 512Mi limit
    cause: Historical node process inspection confirmed Rosetta translation. CPU readings were taken in different
      application states, so they do not quantify an architecture-only causal effect.
    why_earlier_advice_was_wrong: Neither initial success nor overload proves final host capacity. Current host
      choice remains conditional on sustained load, total memory and actual dual-cluster replay.
    note: No server purchase decision has been made. The hybrid architecture is implemented; whole-testbed or RQ3b
      capacity has not yet been accepted.
    chosen_path: Native arm64 applications, existing amd64 MySQL 5.7; no database migration or service reduction.
    historical_options:
    - Native amd64 host, on demand, powered on only for trial batches. Removes translation entirely and is the only
      option that preserves the pinned published image digests.
    - Build arm64 images from the Robot Shop Dockerfiles. Removes translation but replaces the pinned published
      digests, so the reproducibility claim and Section 3.5.1 would both have to change.
    - Reduce the deployed service set. Cheapest, but the resource-relationship condition depends on the dependency
      structure, so this narrows RQ1.
    current_acceptance: results/dual-cluster/acceptance.json
  startup_time:
    observation: 'The shipping container reached a ready state about 3.5 minutes after start under emulation. Trial
      timeouts and reset waits must accommodate this; the exact values will be fixed in the pilot.

      '
  data_restore:
    mode: fixed clean MySQL seed archive to independent per-environment PVC at round start
    datadir: /var/lib/mysql
    archive_sha256: 270b4241a511d725e08b577632bd69a17fe25c71a49e432ac1634136169547c5
    mysql_gate: Separate client pod via Service using shipping and ratings accounts; exact seed row counts before
      load.
    other_stores:
      mongodb: 'recreated pod writable layer, upstream initialization: 11 products and 3 users'
      redis: clear work PVC with round-start Job while stopped, recreate pod, assert DBSIZE=0 before apps
      rabbitmq: recreated pod writable layer; readiness before applications redeclare queues
    during_trial: Ordinary MySQL pod restarts preserve the work PVC; never reseed on restart.
    reset_acceptance:
      passed: true
      consecutive_cycles: 3
      seconds:
      - 153.73
      - 153.58
      - 159.5
      evidence: results/reset-acceptance/summary.json
      scope: Pilot contamination/removal across MySQL, MongoDB, Redis, RabbitMQ; not main trials.
