lock_version: 1
created: '2026-09-29'
purpose: 'Reproducibility pins for the reuse assessment study. Section 3.5.1 requires the testbed to be pinned to
  a recorded source commit, Helm chart revision and container image digests.

  '
repositories:
  robot-shop:
    role: primary testbed application
    citation: Instana. (n.d.). Robot Shop [Computer software]. GitHub.
    url: https://github.com/instana/robot-shop
    commit: 55292e2199f2fb00a165b1f7d3045fe7f8922038
    commit_date: '2023-03-06T07:18:42Z'
    default_branch: master
    license: Apache-2.0
    archived: true
    helm_chart:
      path: K8s/helm
      chart_name: robot-shop
      chart_version: 1.1.0
    notes:
    - 'values.yaml ships image.version: latest. Override to 2.1.0 and resolve digests.'
    - 'values.yaml ships eum.key: null, so the web container has no env block by default.'
    - K8s/load-deployment.yaml references rs-load:latest. Override to the pinned digest.
    - Reset must apply pre-rendered manifests, not helm upgrade, because a repair that deletes and recreates a Service
      drops Helm ownership metadata.
  kubeplaybook:
    role: initial source of candidate playbooks (screened, not assumed qualifying)
    citation: Sarda, K., Namrud, Z., Litoiu, M., Shwartz, L., & Watts, I. (2024a).
    url: https://github.com/K8sPlayBook/KubePlaybook
    commit: 57136d02afa68c2ee5e6df4dc5479d455b98047d
    tag: v1.0.0
    zenodo_doi: 10.5281/zenodo.10833402
    zenodo_concept_doi: 10.5281/zenodo.10833401
    license: MIT
    pin_rationale: 'v1.0.0 is the citable Zenodo artefact. Verified that v1.0.0 and main HEAD (1feef63d1e5b23d1bc08c0368e90e457b6583c4b)
      differ only in README.md, so no candidate playbook content changes between them.

      '
    inventory_at_pin:
      real_time_fault_cases: 14
      real_time_fault_playbooks: 24
      screening_scope: Real_time_fault
  microremed:
    role: fault-injection assets (adapted; see adaptations below)
    citation: L. Zhang et al. (2025, preprint). MicroRemed. arXiv:2511.01166
    url: https://github.com/LLM4AIOps/MicroRemed
    commit: f579d32279188ea9e5843877d3311d8d7b4ea2c3
    commit_date: '2025-11-04T04:21:12Z'
    default_branch: main
    license: NONE
    license_action: 'No licence is declared upstream. Do not redistribute MicroRemed files in the reproducibility
      package. Reference the commit and describe the adaptation instead, or request permission from the authors.

      '
    assets_used:
    - chaos/templates/pod-fail.yaml
    - chaos/injection.py
    assets_not_used:
    - chaos/templates/network-delay.yaml
    - chaos/templates/network-loss.yaml
    - chaos/templates/cpu-stress.yaml
    - chaos/templates/memory-stress.yaml
    - chaos/templates/disk-io.yaml
microremed_adaptations:
- asset: chaos/templates/pod-fail.yaml
  change: labelSelectors key changed from 'app' to 'service'
  reason: 'Robot Shop labels workloads with ''service: <name>'', not ''app: <name>''.'
- asset: chaos/injection.py line 26
  change: label_selector changed from f'app={target_pod}' to f'service={target_pod}'
  reason: 'The pod-config-error path does its own Pod lookup with an app= selector and then walks ownerReferences
    to the Deployment. With the Robot Shop label scheme it would find no Pod and abort, so adapting the template
    alone is not sufficient.

    '
- asset: chaos/injection.py (pod-config-error)
  change: Container selected by name instead of by index containers[0]
  reason: 'Index-based selection is not stable once a scenario inserts a sidecar. The injector must not depend on
    the same positional assumption that a candidate playbook is being tested for.

    '
- asset: chaos/injection.py (pod-config-error)
  change: kubeconfig path is a parameter, not hardcoded /etc/rancher/k3s/k3s.yaml
  reason: Cluster runs under k3d; kubeconfig is not at the k3s host path.
fault_pairing:
  pod-config-error:
    mechanism: 'Patches the Deployment container to requests cpu 1m / memory 100Mi and limits cpu 2m / memory 200Mi,
      verified in chaos/injection.py.

      '
    pairs_with: resource adjustment
    rationale: 'The injected fault is a reduced CPU and memory quota, and the repair action restores the quota.
      This is the closest available pairing between an injected mechanism and a declared repair family, so it is
      assigned first.

      '
    note: 'Relative to the declared baseline memory profile this is still a reduction, so it remains a fault after
      the profile was applied.

      '
  pod-failure:
    mechanism: Chaos Mesh PodChaos, action pod-failure
    pairs_with: workload recovery
    duration_in_template: 1200s
    self_healing_risk: 'The template sets a duration, so the fault expires on its own. If the observation window
      outlasts the duration, expiry would be recorded as a successful repair. The pilot must either set the observation
      window well inside the duration or remove the duration and end the fault explicitly, and the no-repair control
      must confirm the symptom persists for the whole window. This applies to any durative Chaos Mesh fault.

      '
    pending: the choice between bounded duration and explicit teardown is a pilot decision
  pod-failure_duration_decision:
    decision: 'Keep the template duration at 1200s for the pilot. The pilot must confirm that fault confirmation,
      repair execution and the full verification window all complete before expiry. If they do not, adjust the duration
      in the pilot and freeze it before the main trials. Removing the duration to obtain an indefinite fault is
      not assumed to be correct and is not the default.

      '
    control_requirement: 'The matched no-repair control must show the symptom persisting for the whole observation
      window, so that expiry can never be recorded as a repair.

      '
  not_yet_paired:
    configuration repair: 'DECIDED: write a minimal candidate targeting CATALOGUE_HOST on the web workload, restoring
      the correct value. Candidates 9/1 and 9/4 are recorded as screened and rejected: the baseline web container
      has no env block, so the 9/1 JSON patch fails on a missing path, and no consumer of USE_CONNECTION_POOLING
      was found in the application source. The chosen target has a verified consumption path: the web image declares
      ENV CATALOGUE_HOST and entrypoint.sh applies it through envsubst to the nginx template at container start,
      so the value determines routing and only takes effect after a restart. Origin type is recorded as manual,
      and the candidate must pass the same S1 to S4 procedure as any repository candidate.

      '
    Service routing repair: 'DECIDED: write a minimal candidate addressing one explicit failure, either a wrong
      Service selector or a wrong targetPort, and not both. The screening scope will not be widened merely to obtain
      a repository origin. No candidate passed screening within the declared scope. Origin type is recorded as manual,
      and the candidate must pass the same S1 to S4 procedure.

      '
    shared_requirement: 'Both manual candidates must be written before their scenarios are derived, and the repair
      task specification must be fixed first, so that the candidate is not shaped around a scenario the study intends
      to create.

      '
    replica adjustment: 'Fault is a configuration injection that sets replicas to zero; it is not a MicroRemed asset
      and will be recorded as a study-defined injection.

      '
