    override: true
    endpoint: http://user:8080/health
    contract: Explicit local substitute for the upstream dummy gateway HTTP-200 call. No financial transaction is
      performed by this endpoint. Existing payment handler, queue publication and cart deletion remain.
    reason: Avoid uncontrolled external Internet dependency in a single-worker synchronous payment service. The
      source consumes PAYMENT_GATEWAY through requests.get without a timeout; this is a versioned lab configuration,
      not an application upgrade.
    scope: Gateway networking/reliability and real payment processing are outside this testbed evaluation.
    causal_limit: Healthy no-fault control is retained separately. The single payment timeout cannot be attributed
      uniquely to PayPal; local substitution removes a known uncontrolled dependency prospectively, rather than
      re-labelling the failed run.
