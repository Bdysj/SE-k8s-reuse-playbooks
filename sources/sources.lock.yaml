  ansible_core: 2.19.3
  cluster_topology:
    lab: 1 server + 2 agents, traefik disabled
    replica: 'lab-validation: 1 server + 2 agents; full application/Chaos capacity and isolation pilot passed; stopped
      after validation'
  restart_recovery_test:
    performed: k3d cluster stop lab, then k3d cluster start lab
    api_endpoint: unchanged at https://127.0.0.1:6550, so the kubeconfig stayed valid
    fatal_networking_error: did not recur
    node_ips_before:
      server-0: 172.22.0.4
      agent-0: 172.22.0.5
      agent-1: 172.22.0.6
    node_ips_after:
      server-0: 172.22.0.4
      agent-0: 172.22.0.6
      agent-1: 172.22.0.5
    conclusion: 'The pinned API port reliably fixes the stale-kubeconfig problem. The named network keeps the subnet
      stable, which is why the earlier fatal error "failed to find interface with specified node ip" did not recur.
      However the per-node IPs are NOT pinned and did swap between agent-0 and agent-1, so node IP stability must
      not be claimed. All three nodes returned Ready.

      '
    workload_outcome: 'Every Pod restarted once, and ratings and shipping did not return to a ready state, so the
      baseline was not confirmed after the restart. The supported recovery procedure is therefore: start the registry,
      start the cluster, then run tools/reset_baseline.py --hard and require a confirmed baseline. A restarted cluster
      is not assumed to be a valid snapshot.

      '
  verified_on_cluster:
    beta_kubernetes_io_os_label: 'present on k3s v1.33.5 nodes, so the required nodeAffinity in candidate 3 is satisfiable

      '
    amd64_emulation_in_k3d: 'confirmed working; linux/amd64 Robot Shop images run on arm64 k3d nodes

      '
