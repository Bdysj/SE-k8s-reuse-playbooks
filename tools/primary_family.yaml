# Declared primary repair family for each S1-passing candidate.
#
# Section 3.5.2 requires one candidate per repair family. Several KubePlaybook
# candidates perform actions belonging to more than one family, so the primary
# family must be declared before qualification, not chosen after seeing results.
#
# The declaration uses only evidence that already exists in the pinned
# repository: the candidate's own natural-language prompt and Root cause text.
# The quoted evidence is recorded here so the assignment can be audited.
# It does not use any trial outcome.

declared_by: "candidate prompt and Root cause text at KubePlaybook v1.0.0"
declared_on: "2026-09-29"
rule: >
  The primary family is the repair family named by the stated intent of the
  prompt. An action that only supports that intent, such as a restart applied
  after a configuration change, does not change the primary family but is
  registered as part of the frozen candidate.

candidates:

